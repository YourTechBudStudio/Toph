name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build signed macOS artifacts
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    runs-on: macos-14
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed and notarized macOS artifacts
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
        run: pnpm run dist:mac

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: toph-macos
          path: |
            apps/desktop/dist/Toph-*-mac-arm64.dmg
            apps/desktop/dist/Toph-*-mac-arm64.zip
            apps/desktop/dist/Toph-*-mac-x64.dmg
            apps/desktop/dist/Toph-*-mac-x64.zip
            apps/desktop/dist/Toph-*-mac-arm64.dmg.blockmap
            apps/desktop/dist/Toph-*-mac-arm64.zip.blockmap
            apps/desktop/dist/Toph-*-mac-x64.dmg.blockmap
            apps/desktop/dist/Toph-*-mac-x64.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            apps/desktop/dist/Toph-*-mac-arm64.dmg \
            apps/desktop/dist/Toph-*-mac-arm64.zip \
            apps/desktop/dist/Toph-*-mac-x64.dmg \
            apps/desktop/dist/Toph-*-mac-x64.zip \
            apps/desktop/dist/Toph-*-mac-arm64.dmg.blockmap \
            apps/desktop/dist/Toph-*-mac-arm64.zip.blockmap \
            apps/desktop/dist/Toph-*-mac-x64.dmg.blockmap \
            apps/desktop/dist/Toph-*-mac-x64.zip.blockmap \
            apps/desktop/dist/latest-mac.yml \
            --clobber

  build-linux:
    name: Build Linux AppImage
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux AppImage
        run: pnpm run dist:linux

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: toph-linux
          path: |
            apps/desktop/dist/Toph-*-linux-x86_64.AppImage
            apps/desktop/dist/latest-linux.yml
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            apps/desktop/dist/Toph-*-linux-x86_64.AppImage \
            apps/desktop/dist/latest-linux.yml \
            --clobber

  build-windows:
    name: Build unsigned Windows installer
    if: github.event_name == 'release' || github.ref == 'refs/heads/master'
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run dist:win

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: toph-windows
          path: |
            apps/desktop/dist/Toph-*-win-x64-setup.exe
            apps/desktop/dist/Toph-*-win-x64-setup.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error

      - name: Attach artifacts to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            apps/desktop/dist/Toph-*-win-x64-setup.exe \
            apps/desktop/dist/Toph-*-win-x64-setup.exe.blockmap \
            apps/desktop/dist/latest.yml \
            --clobber
